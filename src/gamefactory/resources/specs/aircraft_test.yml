schema_version: "0.7.0"
asset_id: aircraft_fixture
category: aircraft
profile: aircraft
profile_version: 1
intent: >-
  Locally authored wide-span trainer airframe with fixed fuselage, wing and
  tailplane plus a test-only rotating nose propeller. This fixture makes no
  flight or aerodynamic claim.
source_kind: local_operator_assembly
dimensions:
  width_m: 11.0
  height_m: 2.4
  depth_m: 7.84
orientation:
  up: "+Y"
  front: "-Z"
origin_policy: bottom_center
geometry_budget:
  max_triangles_lod0: 10000
  max_triangles_lod1: 5000
  lod_ratio: 0.5
material_budget:
  max_materials: 4
texture_budget:
  max_dimension: 2048
collider:
  policy: box
lod_policy: lod0_lod1
style_constraints:
  family: stylized_scifi
  silhouette: high_wing_trainer
  detail_density: medium
target_engine: godot
target_import_path: assets/generated/aircraft/trainer_aircraft_test/
parts:
  - part_id: fuselage
    role: fuselage
    parent: root
    pivot:
      position_m: [0.0, 1.20, 0.12]
      basis: identity
      motion: {kind: fixed}
  - part_id: wing
    role: wing
    parent: fuselage
    pivot:
      position_m: [0.0, 0.0, 0.10]
      basis: identity
      motion: {kind: fixed}
  - part_id: tailplane
    role: tailplane
    parent: fuselage
    pivot:
      position_m: [0.0, 0.0, 3.05]
      basis: identity
      motion: {kind: fixed}
  - part_id: propeller
    role: propeller
    parent: fuselage
    pivot:
      position_m: [0.0, 0.0, -3.98]
      basis: identity
      motion: {kind: revolute, axis: [0.0, 0.0, 1.0]}
sockets:
  - socket_id: nose_reference
    parent_part: fuselage
    translation_m: [0.0, 0.0, -3.8]
    rotation: identity
    placement: forward_end
  - socket_id: propeller_hub
    parent_part: propeller
    translation_m: [0.0, 0.0, -0.06]
    rotation: identity
    placement: forward_end
