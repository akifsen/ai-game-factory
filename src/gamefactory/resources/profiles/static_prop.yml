schema_version: asset-profile-0.5.0
profile_id: static_prop
version: 1
categories:
  - prop
review_views:
  - front
  - three_quarter
  - side
framing:
  min_screen_fraction: 0.55
  max_screen_fraction: 0.75
  target_screen_fraction: 0.65
  margin_fraction: 0.04
  fov_degrees: 38
dimension_rules:
  min_m: 0.001
  max_m: 100.0
processing:
  lod0_required: true
  lod1_required: true
  allowed_lod_policies:
    - lod0_lod1
  allowed_collider_policies:
    - box
  allowed_origin_policies:
    - bottom_center
    - center
  default_origin_policy: bottom_center
  dimension_tolerance_m: 0.01
  snap_grid_m: null
  rig_forbidden: true
  animation_forbidden: true
  max_materials: 8
  max_texture_dimension: 4096
  max_triangles_lod0: 100000
godot:
  body_kind: static_body
  require_ray_hit: true
  require_area: false
runtime:
  bounds_tolerance_ratio: 0.2
  bounds_tolerance_floor_m: 0.15
