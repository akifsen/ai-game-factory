schema_version: asset-profile-0.7.0
profile_id: aircraft
version: 1
categories:
  - aircraft
review_views:
  - front
  - rear
  - left
  - right
  - side
  - three_quarter
  - three_quarter_front
  - three_quarter_rear
  - top
framing:
  min_screen_fraction: 0.2
  max_screen_fraction: 0.75
  target_screen_fraction: 0.32
  margin_fraction: 0.04
  fov_degrees: 38
dimension_rules:
  min_m: 1.0
  max_m: 20.0
processing:
  lod0_required: true
  lod1_required: true
  allowed_lod_policies:
    - lod0_lod1
  allowed_collider_policies:
    - box
  allowed_origin_policies:
    - bottom_center
  default_origin_policy: bottom_center
  dimension_tolerance_m: 0.02
  snap_grid_m: null
  rig_forbidden: true
  animation_forbidden: true
  max_materials: 4
  max_texture_dimension: 2048
  max_triangles_lod0: 10000
godot:
  body_kind: static_body
  require_ray_hit: true
  require_area: false
runtime:
  bounds_tolerance_ratio: 0.2
  bounds_tolerance_floor_m: 0.15
geometry_mode: assembly
accepted_source_kinds:
  - local_operator_assembly
assembly:
  roles:
    - fuselage
    - wing
    - tailplane
    - propeller
  required_roles:
    - fuselage
    - wing
    - tailplane
    - propeller
  role_motion_constraints:
    fuselage:
      kind: fixed
    wing:
      kind: fixed
    tailplane:
      kind: fixed
    propeller:
      kind: revolute
      axis: [0.0, 0.0, 1.0]
  required_sockets:
    - socket_id: nose_reference
      parent_role: fuselage
      placement: forward_end
      forward_end_fraction: 0.2
      rest_forward: [0.0, 0.0, -1.0]
    - socket_id: propeller_hub
      parent_role: propeller
      placement: forward_end
      forward_end_fraction: 0.2
      rest_forward: [0.0, 0.0, -1.0]
  socket_angle_tolerance_deg: 5.0
  socket_position_tolerance_m: 0.02
  pivot_tolerance_m: 0.01
  basis_tolerance_deg: 1.0
