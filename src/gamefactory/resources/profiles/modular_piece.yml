schema_version: asset-profile-0.5.0
profile_id: modular_piece
version: 1
categories:
  - modular
review_views:
  - front
  - side
  - three_quarter
framing:
  min_screen_fraction: 0.5
  max_screen_fraction: 0.75
  target_screen_fraction: 0.62
  margin_fraction: 0.04
  fov_degrees: 38
