name: CI
run-name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_diagnostics_only == 'true') && 'Candidate diagnostics - not release proof' || github.event_name == 'workflow_dispatch' && 'Full CI' || github.event.pull_request.title || github.sha }}

# CI cost policy
# - Pull requests run only the quick job (Ubuntu, Python 3.11: tests, lint, types).
# - The full set (Windows/Ubuntu x 3.11/3.12, real Godot, real Blender) runs on
#   pushes to main, on manual dispatch, and on a pull request labelled `full-ci`.
# - A newer commit on the same pull request cancels the older run.
# - Markdown-only changes do not start CI; reports, JSON evidence and code do.
# - Manual `candidate_diagnostics_only` (default false) skips the broad matrix and Godot
#   jobs but still builds the shared candidate wheel and runs candidate-v083-real. Diagnostic
#   only — not release proof; keep the input false for a full gate run.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      candidate_diagnostics_only:
        description: >-
          Diagnostic-only candidate slice (shared wheel + candidate-v083-real). Not release
          proof; leave false for the full CI gate (matrix, Godot, candidate unit shards).
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quick:
    # Fast pull request feedback. Skipped when the full set runs instead.
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'full-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/gamefactory
      - run: python -m pytest -ra -p no:cacheprovider -m "not candidate_slow"

  test:
    if: >-
      (github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
      && !(github.event_name == 'workflow_dispatch'
           && github.event.inputs.candidate_diagnostics_only == 'true')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Record Linux filesystem context
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'platform='; uname -a
            printf '\ncheckout_mount:\n'; findmnt -T "$GITHUB_WORKSPACE" -o TARGET,SOURCE,FSTYPE,OPTIONS
            printf '\ntemp_mount:\n'; findmnt -T "${TMPDIR:-/tmp}" -o TARGET,SOURCE,FSTYPE,OPTIONS
            printf '\nfilesystem_capacity:\n'; df -T "$GITHUB_WORKSPACE" "${TMPDIR:-/tmp}"
          } | tee "$RUNNER_TEMP/linux-filesystem-context.txt"
      - name: Archive Linux filesystem context
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: linux-filesystem-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/linux-filesystem-context.txt
          if-no-files-found: warn
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -ra -p no:cacheprovider -m "not candidate_slow"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/gamefactory

  godot-real:
    if: >-
      (github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
      && !(github.event_name == 'workflow_dispatch'
           && github.event.inputs.candidate_diagnostics_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official Godot release metadata, pinned and reviewed with this source:
    # https://raw.githubusercontent.com/godotengine/godot-builds/main/releases/godot-4.7.2-stable.json
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_EXPECTED_VERSION: 4.7.2.stable.official.ed1daf0bf
      GODOT_ARCHIVE_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and install it into a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          python -m build --wheel --outdir "$RUNNER_TEMP/wheelhouse"
          python -m venv "$RUNNER_TEMP/gamefactory-venv"
          venv_python="$RUNNER_TEMP/gamefactory-venv/bin/python"
          wheel="$(find "$RUNNER_TEMP/wheelhouse" -maxdepth 1 -name 'gamefactory-*.whl' -print -quit)"
          test -n "$wheel"
          sha256sum "$wheel" > "$RUNNER_TEMP/gamefactory-wheel.sha256"
          "$venv_python" -m pip install --upgrade pip
          "$venv_python" -m pip install "${wheel}[dev]"
      - name: Restore pinned Godot archive
        uses: actions/cache@v5
        with:
          path: ~/.cache/gamefactory-godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE_SHA512 }}
      - name: Download and verify pinned official Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cache_dir="$HOME/.cache/gamefactory-godot"
          mkdir -p "$cache_dir"
          if [ ! -f "$cache_dir/$archive" ]; then
            curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${archive}" --output "$cache_dir/$archive"
          fi
          # The cached archive is verified against the pinned digest on every run.
          cp "$cache_dir/$archive" "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GODOT_ARCHIVE_SHA512" "$RUNNER_TEMP/$archive" | sha512sum --check --strict
          unzip "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GAMEFACTORY_TEST_GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Record source, platform, executable, and filesystem evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.verification/ci-godot"
          mkdir -p "$evidence/reports" "$evidence/logs" "$RUNNER_TEMP/gamefactory-workspaces"
          cp "$RUNNER_TEMP/gamefactory-wheel.sha256" "$evidence/wheel.sha256"
          git rev-parse HEAD > "$evidence/commit.txt"
          git status --porcelain=v1 > "$evidence/source-status.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$evidence/source-manifest.sha256"
          sha256sum "$GITHUB_WORKSPACE/.verification/ci-godot/source-manifest.sha256" > "$evidence/source-manifest-digest.txt"
          {
            printf 'python='; "$RUNNER_TEMP/gamefactory-venv/bin/python" --version
            printf 'platform='; uname -a
            godot_version="$("$GAMEFACTORY_TEST_GODOT" --version)"
            printf 'godot_version=%s\n' "$godot_version"
            test "$godot_version" = "$GODOT_EXPECTED_VERSION"
            printf 'godot_executable_sha256='; sha256sum "$GAMEFACTORY_TEST_GODOT"
            printf '\ninstalled_package_from_runner_temp:\n'
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/gamefactory-venv/bin/python" -m pip check
            "$RUNNER_TEMP/gamefactory-venv/bin/python" -m pip show gamefactory
            "$RUNNER_TEMP/gamefactory-venv/bin/python" -c 'import gamefactory; print("module_path=" + gamefactory.__file__)'
            printf '\ncheckout_mount:\n'; findmnt -T "$GITHUB_WORKSPACE" -o TARGET,SOURCE,FSTYPE,OPTIONS
            printf '\nrunner_temp_mount:\n'; findmnt -T "$RUNNER_TEMP" -o TARGET,SOURCE,FSTYPE,OPTIONS
            printf '\nrunner_temp_filesystem:\n'; df -T "$RUNNER_TEMP"
          } | tee "$evidence/environment.txt"
      - name: Run pinned real-Godot acceptance
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          evidence="$root/.verification/ci-godot"
          python="$RUNNER_TEMP/gamefactory-venv/bin/python"
          cli="$RUNNER_TEMP/gamefactory-venv/bin/gamefactory"
          "$python" "$root/scripts/verify_godot_acceptance.py" \
            --cli "$cli" \
            --fixture "$root/examples/godot-verification" \
            --godot "$GAMEFACTORY_TEST_GODOT" \
            --output "$evidence/reports/acceptance.json" \
            --workspace "$RUNNER_TEMP/gamefactory-workspaces/acceptance" \
            2>&1 | tee "$evidence/logs/acceptance.log"
      - name: Run recovery and live-crash verification
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          evidence="$root/.verification/ci-godot"
          python="$RUNNER_TEMP/gamefactory-venv/bin/python"
          cli="$RUNNER_TEMP/gamefactory-venv/bin/gamefactory"
          "$python" "$root/scripts/verify_godot_recovery.py" \
            --cli "$cli" \
            --python "$python" \
            --fixture "$root/examples/godot-verification" \
            --godot "$GAMEFACTORY_TEST_GODOT" \
            --output "$evidence/reports/recovery.json" \
            --workspace "$RUNNER_TEMP/gamefactory-workspaces/recovery" \
            2>&1 | tee "$evidence/logs/recovery.log"
          "$python" "$root/scripts/verify_godot_live_crash.py" \
            --cli "$cli" \
            --python "$python" \
            --fixture "$root/examples/godot-verification" \
            --godot "$GAMEFACTORY_TEST_GODOT" \
            --output "$evidence/reports/live-crash.json" \
            --workspace "$RUNNER_TEMP/gamefactory-workspaces/live-crash" \
            2>&1 | tee "$evidence/logs/live-crash.log"
      - name: Archive selected real-engine closeout evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-real-evidence
          path: |
            .verification/ci-godot/reports/*.json
            .verification/ci-godot/logs/*.log
            .verification/ci-godot/commit.txt
            .verification/ci-godot/source-status.txt
            .verification/ci-godot/source-manifest.sha256
            .verification/ci-godot/source-manifest-digest.txt
            .verification/ci-godot/environment.txt
            .verification/ci-godot/wheel.sha256
          if-no-files-found: warn

  godot-rendered:
    if: >-
      (github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
      && !(github.event_name == 'workflow_dispatch'
           && github.event.inputs.candidate_diagnostics_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_EXPECTED_VERSION: 4.7.2.stable.official.ed1daf0bf
      GODOT_ARCHIVE_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install a local software OpenGL display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils blender python3-numpy python3-venv python3-pip
      - name: Build wheel and install it into a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv "$RUNNER_TEMP/gamefactory-venv"
          venv_python="$RUNNER_TEMP/gamefactory-venv/bin/python"
          "$venv_python" -m pip install --upgrade pip
          "$venv_python" -m pip install build
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          "$venv_python" -m build --wheel --outdir "$RUNNER_TEMP/wheelhouse"
          wheel="$(find "$RUNNER_TEMP/wheelhouse" -maxdepth 1 -name 'gamefactory-*.whl' -print -quit)"
          test -n "$wheel"
          sha256sum "$wheel" > "$RUNNER_TEMP/gamefactory-wheel.sha256"
          "$venv_python" -m pip install "$wheel"
      - name: Restore pinned Godot archive
        uses: actions/cache@v5
        with:
          path: ~/.cache/gamefactory-godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE_SHA512 }}
      - name: Download and verify pinned official Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cache_dir="$HOME/.cache/gamefactory-godot"
          mkdir -p "$cache_dir"
          if [ ! -f "$cache_dir/$archive" ]; then
            curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${archive}" --output "$cache_dir/$archive"
          fi
          # The cached archive is verified against the pinned digest on every run.
          cp "$cache_dir/$archive" "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GODOT_ARCHIVE_SHA512" "$RUNNER_TEMP/$archive" | sha512sum --check --strict
          unzip "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GAMEFACTORY_TEST_GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Capture with Xvfb and llvmpipe
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.verification/ci-godot-rendered"
          mkdir -p "$evidence"
          {
            printf 'renderer_request=gl_compatibility opengl3 x11\n'
            printf 'software_rendering_request=LIBGL_ALWAYS_SOFTWARE=%s\n' "$LIBGL_ALWAYS_SOFTWARE"
            printf 'note=LIBGL_ALWAYS_SOFTWARE is a process request, not the engine-reported adapter. Read publish/*/render-context.json.\n'
            "$GAMEFACTORY_TEST_GODOT" --version
            sha256sum "$GAMEFACTORY_TEST_GODOT"
            cp "$RUNNER_TEMP/gamefactory-wheel.sha256" "$evidence/wheel.sha256"
            git rev-parse HEAD > "$evidence/commit.txt"
          } | tee "$evidence/environment.txt"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            "$RUNNER_TEMP/gamefactory-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/verify_godot_capture.py" \
            --cli "$RUNNER_TEMP/gamefactory-venv/bin/gamefactory" \
            --fixture "$GITHUB_WORKSPACE/examples/godot-verification" \
            --godot "$GAMEFACTORY_TEST_GODOT" \
            --output "$evidence/acceptance.json" \
            --workspace "$RUNNER_TEMP/capture-workspaces" \
            --publish "$evidence/publish"
      - name: Interrupt a live rendered capture
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.verification/ci-godot-rendered"
          python="$RUNNER_TEMP/gamefactory-venv/bin/python"
          cli="$RUNNER_TEMP/gamefactory-venv/bin/gamefactory"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            "$python" "$GITHUB_WORKSPACE/scripts/verify_godot_live_crash.py" \
            --rendered-capture \
            --cli "$cli" \
            --python "$python" \
            --fixture "$GITHUB_WORKSPACE/examples/godot-verification" \
            --godot "$GAMEFACTORY_TEST_GODOT" \
            --output "$evidence/rendered-interrupt.json" \
            --workspace "$RUNNER_TEMP/rendered-interrupt-workspaces" \
            --timeout 180
      - name: Configure and verify Blender Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.verification/ci-asset-production"
          mkdir -p "$evidence"
          venv_python="$RUNNER_TEMP/gamefactory-venv/bin/python"
          printf 'host_python=%s\n' "$(/usr/bin/python3 --version)"
          printf 'command_python3=%s\n' "$(command -v python3 || true)"
          printf 'command_python312=%s\n' "$(command -v python3.12 || true)"
          printf 'factory_venv_python=%s\n' "$venv_python"
          printf 'factory_venv_version=%s\n' "$("$venv_python" --version)"
          printf 'factory_venv_provenance=%s\n' "$("$venv_python" -c 'import sys; print(sys.base_prefix, sys.version)')"
          printf 'factory_venv_base_readlink=%s\n' "$(readlink -f "$("$venv_python" -c 'import sys; print(getattr(sys, "_base_executable", sys.executable))')" || true)"
          BLENDER_NUMPY_PATH="$(/usr/bin/python3 -c 'import pathlib, numpy; print(pathlib.Path(numpy.__file__).resolve().parent.parent)')"
          printf 'host_numpy_version=%s\n' "$(/usr/bin/python3 -c 'import numpy; print(numpy.__version__)')"
          printf 'blender_numpy_path=%s\n' "$BLENDER_NUMPY_PATH"
          echo "GAMEFACTORY_BLENDER_PYTHONPATH=$BLENDER_NUMPY_PATH" >> "$GITHUB_ENV"
          "$venv_python" "$GITHUB_WORKSPACE/scripts/verify_blender_dependencies.py" \
            --blender "$(command -v blender)" \
            --python-path "$BLENDER_NUMPY_PATH" \
            --forbid-python-prefix /opt/hostedtoolcache \
            --output "$evidence/blender-dependencies.json"
      - name: Verify offline asset production with real Blender and Godot
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.verification/ci-asset-production"
          mkdir -p "$evidence"
          mkdir -p "$RUNNER_TEMP/asset-production-workspace"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            "$RUNNER_TEMP/gamefactory-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/verify_asset_acceptance.py" \
            --cli "$RUNNER_TEMP/gamefactory-venv/bin/gamefactory" \
            --python "$RUNNER_TEMP/gamefactory-venv/bin/python" \
            --blender "$(command -v blender)" \
            --godot "$GAMEFACTORY_TEST_GODOT" \
            --workspace "$RUNNER_TEMP/asset-production-workspace" \
            --output "$evidence/acceptance.json"
      - name: Verify pickup and modular profile fixtures offline
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.verification/ci-asset-production"
          mkdir -p "$evidence"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            "$RUNNER_TEMP/gamefactory-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/verify_profile_fixtures.py" \
            --python "$RUNNER_TEMP/gamefactory-venv/bin/python" \
            --blender "$(command -v blender)" \
            --godot "$GAMEFACTORY_TEST_GODOT" \
            --workspace "$RUNNER_TEMP/profile-fixture-workspace" \
            --output "$evidence/profile-fixtures.json"
      - name: Verify V0.7 assemblies and character capsule with real Blender and Godot
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/.verification/ci-asset-production"
          mkdir -p "$evidence" "$RUNNER_TEMP/v07-acceptance-workspace"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            "$RUNNER_TEMP/gamefactory-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/verify_v07_acceptance.py" \
            --cli "$RUNNER_TEMP/gamefactory-venv/bin/gamefactory" \
            --blender "$(command -v blender)" \
            --godot "$GAMEFACTORY_TEST_GODOT" \
            --workspace "$RUNNER_TEMP/v07-acceptance-workspace" \
            --output "$evidence/v07-acceptance.json"
      - name: Verify internal rig and skin with installed wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          evidence="$root/.verification/ci-internal-rig"
          mkdir -p "$evidence/reports" "$evidence/logs"
          cp "$RUNNER_TEMP/gamefactory-wheel.sha256" "$evidence/wheel.sha256"
          git -C "$root" rev-parse HEAD > "$evidence/commit.txt"
          venv_python="$RUNNER_TEMP/gamefactory-venv/bin/python"
          wheel="$(find "$RUNNER_TEMP/wheelhouse" -maxdepth 1 -name 'gamefactory-*.whl' -print -quit)"
          test -n "$wheel"
          "$venv_python" -m pip install "${wheel}[dev]"
          export GAMEFACTORY_TEST_BLENDER="$(command -v blender)"
          test -x "$GAMEFACTORY_TEST_BLENDER"
          test -x "$GAMEFACTORY_TEST_GODOT"
          echo "GAMEFACTORY_TEST_BLENDER=$GAMEFACTORY_TEST_BLENDER" >> "$GITHUB_ENV"
          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          export LIBGL_ALWAYS_SOFTWARE=1
          "$venv_python" -c 'import os; import gamefactory; from pathlib import Path; mod=Path(gamefactory.__file__).resolve(); ws=Path(os.environ["GITHUB_WORKSPACE"]).resolve(); assert not str(mod).startswith(str(ws)), mod'
          skin_real="$root/tests/integration/test_internal_skin_real_tools.py"
          rig_real="$root/tests/integration/test_internal_rig_real_tools.py"
          collect_log="$evidence/logs/real-tools-collect.txt"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            "$venv_python" -m pytest --collect-only -q "$skin_real" "$rig_real" \
            2>&1 | tee "$collect_log"
          grep -E '(^|[[:space:]])6 tests collected' "$collect_log"
          junit_real="$RUNNER_TEMP/internal-real-tools-junit.xml"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            "$venv_python" -m pytest -ra -p no:cacheprovider \
            --junitxml="$junit_real" \
            "$skin_real" \
            "$rig_real" \
            2>&1 | tee "$evidence/logs/real-tools-pytest.log"
          cp "$junit_real" "$evidence/reports/real-tools-junit.xml"
          "$venv_python" -c "import sys,xml.etree.ElementTree as ET;r=ET.parse(sys.argv[1]).getroot();su=r.findall('testsuite') if r.tag=='testsuites' else [r];t=sum(int(x.get('tests',0)) for x in su);f=sum(int(x.get('failures',0)) for x in su);e=sum(int(x.get('errors',0)) for x in su);s=sum(int(x.get('skipped',0)) for x in su);assert (t,f,e,s)==(6,0,0,0),(t,f,e,s)" "$junit_real"
          unit_paths=(
            "$root/tests/unit/test_internal_rig_cold.py"
            "$root/tests/unit/test_internal_rig_evidence_export.py"
            "$root/tests/unit/test_internal_rig_schemas.py"
            "$root/tests/unit/test_internal_skin_region.py"
            "$root/tests/unit/test_internal_skin_validation.py"
            "$root/tests/unit/test_skin_oracle_runner.py"
            "$root/tests/unit/test_skin_oracle_verify.py"
          )
          junit_units="$RUNNER_TEMP/internal-units-junit.xml"
          "$venv_python" -m pytest -ra -p no:cacheprovider \
            --junitxml="$junit_units" \
            "${unit_paths[@]}" \
            2>&1 | tee "$evidence/logs/units-pytest.log"
          cp "$junit_units" "$evidence/reports/units-junit.xml"
          {
            printf 'GAMEFACTORY_TEST_BLENDER=%s\n' "$(command -v blender)"
            printf 'GAMEFACTORY_TEST_GODOT=%s\n' "$GAMEFACTORY_TEST_GODOT"
            printf 'GAMEFACTORY_BLENDER_PYTHONPATH=%s\n' "$GAMEFACTORY_BLENDER_PYTHONPATH"
            printf 'PYTHONNOUSERSITE=%s\n' "$PYTHONNOUSERSITE"
            printf 'working_directory=%s\n' "$PWD"
            "$venv_python" -c 'import gamefactory; print("module_path=" + gamefactory.__file__)'
          } | tee "$evidence/environment.txt"
      - name: Archive offline asset evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asset-production-offline-evidence
          path: .verification/ci-asset-production/**/*
          if-no-files-found: warn
      - name: Archive internal rig and skin CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: internal-rig-skin-ci-evidence
          path: .verification/ci-internal-rig/**/*
          if-no-files-found: warn
      - name: Archive selected rendered evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-rendered-evidence
          path: |
            .verification/ci-godot-rendered/acceptance.json
            .verification/ci-godot-rendered/environment.txt
            .verification/ci-godot-rendered/commit.txt
            .verification/ci-godot-rendered/wheel.sha256
            .verification/ci-godot-rendered/rendered-interrupt.json
            .verification/ci-godot-rendered/publish/**/*
          if-no-files-found: warn

  candidate-wheel:
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.candidate_diagnostics_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build exact-HEAD pure candidate wheel
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          artifact_dir="$RUNNER_TEMP/candidate-v083-wheel"
          mkdir -p "$artifact_dir/builder-source"
          python "$root/scripts/verify_v08_candidate_ci.py" write-provenance \
            --output-dir "$artifact_dir/builder-source" \
            --require-clean \
            --role builder
          cp "$artifact_dir/builder-source/commit.txt" "$artifact_dir/commit.txt"
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$artifact_dir"
          wheel="$(find "$artifact_dir" -maxdepth 1 -name 'gamefactory-*.whl' -print -quit)"
          test -n "$wheel"
          sha256sum "$wheel" | tee "$artifact_dir/wheel.sha256"
          python "$root/scripts/verify_v08_candidate_ci.py" wheel-verify \
            --mode builder \
            --wheel "$wheel" \
            --expected-head "$(git -C "$root" rev-parse HEAD)"
      - name: Upload candidate wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: candidate-v083-wheel
          path: ${{ runner.temp }}/candidate-v083-wheel/**
          if-no-files-found: error

  candidate-unit-installed:
    needs: candidate-wheel
    if: >-
      (github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
      && !(github.event_name == 'workflow_dispatch'
           && github.event.inputs.candidate_diagnostics_only == 'true')
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.11', shard: 1, timeout_minutes: 40 }
          - { os: ubuntu-latest, python-version: '3.12', shard: 1, timeout_minutes: 40 }
          - { os: windows-latest, python-version: '3.11', shard: 1, timeout_minutes: 40 }
          - { os: windows-latest, python-version: '3.12', shard: 1, timeout_minutes: 40 }
          - { os: ubuntu-latest, python-version: '3.11', shard: 2, timeout_minutes: 35 }
          - { os: ubuntu-latest, python-version: '3.12', shard: 2, timeout_minutes: 35 }
          - { os: windows-latest, python-version: '3.11', shard: 2, timeout_minutes: 35 }
          - { os: windows-latest, python-version: '3.12', shard: 2, timeout_minutes: 35 }
          - { os: ubuntu-latest, python-version: '3.11', shard: 3, timeout_minutes: 45 }
          - { os: ubuntu-latest, python-version: '3.12', shard: 3, timeout_minutes: 45 }
          - { os: windows-latest, python-version: '3.11', shard: 3, timeout_minutes: 45 }
          - { os: windows-latest, python-version: '3.12', shard: 3, timeout_minutes: 45 }
          - { os: ubuntu-latest, python-version: '3.11', shard: 4, timeout_minutes: 35 }
          - { os: ubuntu-latest, python-version: '3.12', shard: 4, timeout_minutes: 35 }
          - { os: windows-latest, python-version: '3.11', shard: 4, timeout_minutes: 35 }
          - { os: windows-latest, python-version: '3.12', shard: 4, timeout_minutes: 35 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download candidate wheel artifact
        uses: actions/download-artifact@v6
        with:
          name: candidate-v083-wheel
          path: ${{ runner.temp }}/candidate-v083-wheel
      - name: Install shared candidate wheel and run shard
        shell: bash
        env:
          CANDIDATE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          artifact_dir="$RUNNER_TEMP/candidate-v083-wheel"
          wheel="$(find "$artifact_dir" -maxdepth 1 -name 'gamefactory-*.whl' -print -quit)"
          test -n "$wheel"
          expected_head="$(tr -d '\n' < "$artifact_dir/commit.txt")"
          expected_sha="$(awk '{print $1}' "$artifact_dir/wheel.sha256")"
          test "$(git -C "$root" rev-parse HEAD)" = "$expected_head"
          test "$(git -C "$root" rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m venv "$RUNNER_TEMP/candidate-unit-venv"
          if [ -x "$RUNNER_TEMP/candidate-unit-venv/bin/python" ]; then
            venv_py="$RUNNER_TEMP/candidate-unit-venv/bin/python"
          else
            venv_py="$RUNNER_TEMP/candidate-unit-venv/Scripts/python.exe"
          fi
          "$venv_py" -m pip install --upgrade pip
          "$venv_py" -m pip install "${wheel}[dev]"
          python "$root/scripts/verify_v08_candidate_ci.py" wheel-verify \
            --mode consumer \
            --wheel "$wheel" \
            --expected-head "$expected_head" \
            --expected-sha256 "$expected_sha" \
            --python "$venv_py" \
            --workspace "$root"
          unit_evidence="$root/.verification/ci-candidate-unit/shard-${CANDIDATE_SHARD}-${{ matrix.os }}-${{ matrix.python-version }}"
          mkdir -p "$unit_evidence/builder-source" "$unit_evidence/consumer-source"
          python "$root/scripts/verify_v08_candidate_ci.py" write-provenance \
            --output-dir "$unit_evidence/consumer-source" \
            --expected-head "$expected_head" \
            --require-clean \
            --role consumer
          cp -a "$artifact_dir/builder-source/." "$unit_evidence/builder-source/"
          cp "$artifact_dir/wheel.sha256" "$unit_evidence/wheel.sha256"
          cp "$artifact_dir/commit.txt" "$unit_evidence/commit.txt"
          if [ "$CANDIDATE_SHARD" = "1" ] && [ "${{ matrix.python-version }}" = "3.11" ] && [ "${{ runner.os }}" = "Linux" ]; then
            python "$root/scripts/verify_v08_candidate_ci.py" inventory \
              --python "$venv_py" --repo "$root" --collect-cwd "$RUNNER_TEMP"
            python "$root/scripts/verify_v08_candidate_ci.py" marker-propagation \
              --python "$venv_py" --repo "$root"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            platform=linux
          else
            platform=windows
          fi
          expectations="$("$venv_py" "$root/scripts/verify_v08_candidate_ci.py" shard-expectations --shard "$CANDIDATE_SHARD" --platform "$platform" | tr -d '\r')"
          raw_count="$("$venv_py" -c 'import json,sys; print(json.load(sys.stdin)["raw_test_count"])' <<<"$expectations" | tr -d '\r')"
          expected_skipped="$("$venv_py" -c 'import json,sys; print(json.load(sys.stdin)["expected_skipped"])' <<<"$expectations" | tr -d '\r')"
          mapfile -t shard_paths < <("$venv_py" -c 'import json,sys; print("\n".join(json.load(sys.stdin)["modules"]))' <<<"$expectations" | tr -d '\r')
          collect_log="$unit_evidence/candidate-shard-collect.txt"
          collect_nodes="$unit_evidence/candidate-shard-collect-nodes.txt"
          abs_paths=()
          for rel in "${shard_paths[@]}"; do
            abs_paths+=("$root/$rel")
          done
          collect_node_args=(
            --python "$venv_py" --repo "$root" --collect-cwd "$RUNNER_TEMP"
            --output "$collect_nodes"
            --expected-shard "$CANDIDATE_SHARD"
          )
          for abs_path in "${abs_paths[@]}"; do
            collect_node_args+=(--path "$abs_path")
          done
          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          cd "$RUNNER_TEMP"
          python "$root/scripts/verify_v08_candidate_ci.py" collect-nodes "${collect_node_args[@]}"
          "$venv_py" -m pytest --collect-only -q --rootdir "$root" --import-mode=importlib \
            -o "pythonpath=$root" -p no:cacheprovider "${abs_paths[@]}" 2>&1 | tee "$collect_log"
          grep -E "(^|[[:space:]])${raw_count} tests collected" "$collect_log"
          junit_path="$unit_evidence/candidate-unit-junit.xml"
          install_probe="$("$venv_py" -I -c 'import json, gamefactory, pathlib; print(json.dumps({"module_path": gamefactory.__file__, "version": gamefactory.__version__}))')"
          printf '%s\n' "$install_probe" > "$unit_evidence/installed-package.json"
          {
            printf 'os=%s\n' "${{ runner.os }}"
            printf 'python_version=%s\n' "${{ matrix.python-version }}"
            printf 'shard=%s\n' "$CANDIDATE_SHARD"
            printf 'venv_python=%s\n' "$venv_py"
            printf 'commit=%s\n' "$expected_head"
            printf 'wheel_sha256=%s\n' "$expected_sha"
            printf 'installed_package=%s\n' "$install_probe"
          } > "$unit_evidence/environment.txt"
          "$venv_py" -m pytest -ra --rootdir "$root" --import-mode=importlib -o "pythonpath=$root" \
            -p no:cacheprovider --junitxml="$junit_path" "${abs_paths[@]}"
          junit_args=(--junit "$junit_path" --tests "$raw_count" --failures 0 --errors 0 --skipped "$expected_skipped" --collect-nodes "$collect_nodes")
          while IFS= read -r nodeid; do
            [ -n "$nodeid" ] || continue
            junit_args+=(--allowed-skip "$nodeid")
          done < <("$venv_py" -c 'import json,sys; print("\n".join(json.load(sys.stdin)["platform_skip_nodeids"]))' <<<"$expectations" | tr -d '\r')
          python "$root/scripts/verify_v08_candidate_ci.py" junit-assert "${junit_args[@]}"
      - name: Upload candidate unit shard evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-v083-unit-${{ matrix.os }}-py${{ matrix.python-version }}-shard-${{ matrix.shard }}
          path: |
            .verification/ci-candidate-unit/shard-${{ matrix.shard }}-${{ matrix.os }}-${{ matrix.python-version }}/**
          if-no-files-found: error

  candidate-v083-real:
    needs: candidate-wheel
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'full-ci')
          && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.candidate_diagnostics_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_EXPECTED_VERSION: 4.7.2.stable.official.ed1daf0bf
      GODOT_ARCHIVE_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install software OpenGL display and Blender dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils blender python3-numpy python3-venv python3-pip
      - name: Download candidate wheel artifact
        uses: actions/download-artifact@v6
        with:
          name: candidate-v083-wheel
          path: ${{ runner.temp }}/candidate-v083-wheel
      - name: Install shared candidate wheel into clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          artifact_dir="$RUNNER_TEMP/candidate-v083-wheel"
          wheel="$(find "$artifact_dir" -maxdepth 1 -name 'gamefactory-*.whl' -print -quit)"
          test -n "$wheel"
          expected_head="$(tr -d '\n' < "$artifact_dir/commit.txt")"
          expected_sha="$(awk '{print $1}' "$artifact_dir/wheel.sha256")"
          test "$(git -C "$root" rev-parse HEAD)" = "$expected_head"
          test "$(git -C "$root" rev-parse HEAD)" = "${GITHUB_SHA}"
          /usr/bin/python3 -m venv "$RUNNER_TEMP/candidate-real-venv"
          venv_py="$RUNNER_TEMP/candidate-real-venv/bin/python"
          "$venv_py" -m pip install --upgrade pip
          "$venv_py" -m pip install "${wheel}[dev]"
          python "$root/scripts/verify_v08_candidate_ci.py" wheel-verify \
            --mode consumer \
            --wheel "$wheel" \
            --expected-head "$expected_head" \
            --expected-sha256 "$expected_sha" \
            --python "$venv_py" \
            --workspace "$root"
          BLENDER_NUMPY_PATH="$(/usr/bin/python3 -c 'import pathlib, numpy; print(pathlib.Path(numpy.__file__).resolve().parent.parent)')"
          echo "GAMEFACTORY_BLENDER_PYTHONPATH=$BLENDER_NUMPY_PATH" >> "$GITHUB_ENV"
          echo "GAMEFACTORY_TEST_BLENDER=$(command -v blender)" >> "$GITHUB_ENV"
          mkdir -p "$root/.verification/ci-candidate-real"
          "$venv_py" "$root/scripts/verify_blender_dependencies.py" \
            --blender "$(command -v blender)" \
            --python-path "$BLENDER_NUMPY_PATH" \
            --forbid-python-prefix /opt/hostedtoolcache \
            --output "$root/.verification/ci-candidate-real/blender-dependencies.json"
      - name: Restore pinned Godot archive
        uses: actions/cache@v5
        with:
          path: ~/.cache/gamefactory-godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_ARCHIVE_SHA512 }}
      - name: Download and verify pinned official Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cache_dir="$HOME/.cache/gamefactory-godot"
          mkdir -p "$cache_dir"
          if [ ! -f "$cache_dir/$archive" ]; then
            curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${archive}" --output "$cache_dir/$archive"
          fi
          cp "$cache_dir/$archive" "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GODOT_ARCHIVE_SHA512" "$RUNNER_TEMP/$archive" | sha512sum --check --strict
          unzip "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GAMEFACTORY_TEST_GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Record candidate real-tool environment evidence
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          evidence="$root/.verification/ci-candidate-real"
          artifact_dir="$RUNNER_TEMP/candidate-v083-wheel"
          expected_head="$(tr -d '\n' < "$artifact_dir/commit.txt")"
          mkdir -p "$evidence/builder-source" "$evidence/consumer-source"
          python "$root/scripts/verify_v08_candidate_ci.py" write-provenance \
            --output-dir "$evidence/consumer-source" \
            --expected-head "$expected_head" \
            --require-clean \
            --role consumer
          cp -a "$artifact_dir/builder-source/." "$evidence/builder-source/"
          cp "$artifact_dir/wheel.sha256" "$evidence/wheel.sha256"
          cp "$artifact_dir/commit.txt" "$evidence/commit.txt"
          {
            printf 'GAMEFACTORY_TEST_BLENDER=%s\n' "$GAMEFACTORY_TEST_BLENDER"
            printf 'GAMEFACTORY_TEST_GODOT=%s\n' "$GAMEFACTORY_TEST_GODOT"
            printf 'GAMEFACTORY_BLENDER_PYTHONPATH=%s\n' "$GAMEFACTORY_BLENDER_PYTHONPATH"
            printf 'LIBGL_ALWAYS_SOFTWARE=%s\n' "$LIBGL_ALWAYS_SOFTWARE"
            blender_version="$(blender --version | head -n 1)"
            printf 'blender_version=%s\n' "$blender_version"
            printf 'blender_dependencies_json=%s\n' "$evidence/blender-dependencies.json"
            "$RUNNER_TEMP/candidate-real-venv/bin/python" -c 'import gamefactory; print("module_path=" + gamefactory.__file__)'
            godot_version="$("$GAMEFACTORY_TEST_GODOT" --version)"
            printf 'godot_version=%s\n' "$godot_version"
            test "$godot_version" = "$GODOT_EXPECTED_VERSION"
          } | tee "$evidence/environment.txt"
      - name: Run candidate real integration gate under Xvfb
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          GAMEFACTORY_CI_CANDIDATE_EVIDENCE_DIR: ${{ github.workspace }}/.verification/ci-candidate
          GAMEFACTORY_CI_CANDIDATE_REAL_EVIDENCE_DIR: ${{ github.workspace }}/.verification/ci-candidate-real
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          evidence="$root/.verification/ci-candidate-real"
          mkdir -p "$evidence/logs" "$evidence/reports"
          venv_py="$RUNNER_TEMP/candidate-real-venv/bin/python"
          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          export LIBGL_ALWAYS_SOFTWARE=1
          integration_paths=(
            "$root/tests/integration/test_v08_candidate_blender_static.py"
            "$root/tests/integration/test_v08_candidate_runtime_godot.py"
            "$root/tests/integration/test_v08_candidate_workflow_engine.py"
          )
          collect_log="$evidence/logs/candidate-real-collect.txt"
          collect_nodes="$evidence/logs/candidate-real-collect-nodes.txt"
          junit_real="$evidence/reports/candidate-real-junit.xml"
          xvfb_collect_script="$RUNNER_TEMP/candidate-real-collect-under-xvfb.sh"
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' "python \"$root/scripts/verify_v08_candidate_ci.py\" collect-nodes --python \"$venv_py\" --repo \"$root\" --collect-cwd \"$RUNNER_TEMP\" --output \"$collect_nodes\" $(printf -- '--path %q ' "${integration_paths[@]}")"
            printf '%s\n' "\"$venv_py\" -m pytest --collect-only -q --rootdir \"$root\" --import-mode=importlib -o \"pythonpath=$root\" -p no:cacheprovider $(printf ' %q' "${integration_paths[@]}")"
          } > "$xvfb_collect_script"
          chmod +x "$xvfb_collect_script"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            env GAMEFACTORY_TEST_BLENDER="$GAMEFACTORY_TEST_BLENDER" \
                GAMEFACTORY_TEST_GODOT="$GAMEFACTORY_TEST_GODOT" \
                GAMEFACTORY_BLENDER_PYTHONPATH="$GAMEFACTORY_BLENDER_PYTHONPATH" \
                GAMEFACTORY_CI_CANDIDATE_EVIDENCE_DIR="$GAMEFACTORY_CI_CANDIDATE_EVIDENCE_DIR" \
                LIBGL_ALWAYS_SOFTWARE="$LIBGL_ALWAYS_SOFTWARE" \
                PYTHONNOUSERSITE=1 \
            "$xvfb_collect_script" \
            2>&1 | tee "$collect_log"
          grep -E '(^|[[:space:]])6 tests collected' "$collect_log"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            env GAMEFACTORY_TEST_BLENDER="$GAMEFACTORY_TEST_BLENDER" \
                GAMEFACTORY_TEST_GODOT="$GAMEFACTORY_TEST_GODOT" \
                GAMEFACTORY_BLENDER_PYTHONPATH="$GAMEFACTORY_BLENDER_PYTHONPATH" \
                GAMEFACTORY_CI_CANDIDATE_EVIDENCE_DIR="$GAMEFACTORY_CI_CANDIDATE_EVIDENCE_DIR" \
                LIBGL_ALWAYS_SOFTWARE="$LIBGL_ALWAYS_SOFTWARE" \
                PYTHONNOUSERSITE=1 \
            "$venv_py" -m pytest -ra --rootdir "$root" --import-mode=importlib -o "pythonpath=$root" \
            -p no:cacheprovider \
            --junitxml="$junit_real" \
            "${integration_paths[@]}" \
            2>&1 | tee "$evidence/logs/candidate-real-pytest.log"
          python "$root/scripts/verify_v08_candidate_ci.py" junit-assert \
            --junit "$junit_real" --tests 6 --failures 0 --errors 0 --skipped 0 \
            --collect-nodes "$collect_nodes"
          python "$root/scripts/verify_v08_candidate_ci.py" assert-ci-candidate-artifacts --repo "$root"
      - name: Archive selected candidate real evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-v083-real-evidence
          path: |
            .verification/ci-candidate-real/**
            .verification/ci-candidate/manifest.json
            .verification/ci-candidate/result.json
            .verification/ci-candidate/export-marker.json
            .verification/ci-candidate/trusted-cold-outcome.json
            .verification/ci-candidate/archive-hash-manifest.sha256
          if-no-files-found: error
