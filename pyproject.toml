[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamefactory"
dynamic = ["version"]
description = "Deterministic orchestration core for agentic game development"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Game Factory Core Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
gamefactory = "gamefactory.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gamefactory.__version__"}

[tool.setuptools.package-data]
gamefactory = [
    "schemas/*.json",
    "resources/godot/*.gd",
    "resources/blender/*.py",
    "resources/specs/*.yml",
    "resources/specs/*.json",
    "resources/profiles/*.yml",
    "resources/fixtures/*.yml",
    "resources/scripts/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".verify-venv", ".verification", ".gamefactory", "examples/minimal-godot/.godot"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
exclude = [".venv", ".verify-venv", ".verification"]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = ["real_godot: opt-in tests against an actual Godot executable"]
